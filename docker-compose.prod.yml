# Production stack: mysql + redis + backend + frontend, for the APP VPS.
# Local dev keeps using docker-compose.yml (just mysql+redis) with the app
# run natively via .claude/launch.json -- this file is for an actual VPS
# deploy.
#
# Caddy (reverse proxy / automatic HTTPS) is deliberately NOT in this file
# -- see deploy/edge/README.md for why it runs on its own separate VPS
# instead, and set up that edge VPS (plus the firewall rule it depends on)
# before exposing this stack to the internet at all.
#
# Usage: copy .env.example to .env, fill it in, then:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+aiomysql://root:${DB_ROOT_PASSWORD}@mysql:3306/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHIPPING_CREDENTIALS_ENCRYPTION_KEY: ${SHIPPING_CREDENTIALS_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
    # Published so the edge VPS's Caddy can reach it (deploy/edge/Caddyfile) --
    # MUST be firewalled to only accept connections from the edge VPS's IP
    # (or bound to a private-network interface instead), never left open to
    # the internet. See deploy/edge/README.md step 2.
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time -- must be the public
        # https:// API domain, not the internal "backend:8000" service name.
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
    environment:
      JWT_SECRET_KEY: ${SECRET_KEY}
      # Lets proxy.ts (frontend/src/proxy.ts) tell "the platform's own
      # domain" apart from "a tenant's custom domain" at runtime.
      APP_DOMAIN: ${APP_DOMAIN}
      # proxy.ts's custom-domain resolver calls this at request time (not
      # baked into the client bundle) -- the internal docker network address
      # is faster and doesn't depend on the edge VPS's Caddy being up (see
      # deploy/edge/README.md -- frontend and backend still share this one
      # docker network even though Caddy no longer does).
      INTERNAL_API_BASE_URL: http://backend:8000
    # Published so the edge VPS's Caddy can reach it -- same firewall
    # requirement as the backend's ports block above.
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  uploads:
