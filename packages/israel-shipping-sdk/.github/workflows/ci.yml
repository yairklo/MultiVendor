name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test
        # -rX surfaces xpass/xfail reasons in the log instead of hiding
        # them, so the HFD tracking-status assumption (see NOTICE / spec
        # A.2) stays visible rather than bit-rotting silently.
        run: pytest --cov=israel_shipping_sdk --cov-fail-under=90 -rX
