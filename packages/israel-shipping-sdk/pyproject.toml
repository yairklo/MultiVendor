[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "israel-shipping-sdk"
version = "0.1.0"
description = "Unified Python SDK for Israeli courier APIs (HFD, LionWheel)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic[email]>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/israel_shipping_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["israel_shipping_sdk"]
