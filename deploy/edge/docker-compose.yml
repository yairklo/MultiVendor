# The edge stack: just Caddy, on its own dedicated VPS. See ./README.md for
# why this is split from the app stack (docker-compose.prod.yml at the repo
# root) instead of running both on one box.
#
# Usage on the edge VPS:
#   1. Copy this whole deploy/edge/ directory to the edge VPS.
#   2. Copy .env.example to .env and fill it in (needs APP_UPSTREAM_HOST --
#      the app VPS's address, see README.md).
#   3. docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      APP_UPSTREAM_HOST: ${APP_UPSTREAM_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
