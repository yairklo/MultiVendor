name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: multivendor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Matches what tests/conftest.py hardcodes for local runs -- the test
      # suite forces this exact DATABASE_URL itself, this is just so
      # `alembic upgrade head` (run before pytest, see below) targets the
      # same database.
      DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/multivendor_test
      REDIS_URL: redis://127.0.0.1:6379/0
      # Fernet key for tests/test_shipping.py -- app/core/crypto.py raises RuntimeError
      # (not a graceful no-op, unlike PAYMENT_PROVIDER/STORAGE_TYPE's optional keys) when
      # this is unset, so shipping-config tests always need *a* valid key. Test-only,
      # unrelated to any real deployment's key -- generated fresh for this workflow with
      # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
      SHIPPING_CREDENTIALS_ENCRYPTION_KEY: 1lY-uGR_nVhJPeed5kYHnG-42pwwyu7QkjhhjqT3thQ=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: server
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: server
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate route types
        working-directory: frontend
        run: npx next typegen

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8005
